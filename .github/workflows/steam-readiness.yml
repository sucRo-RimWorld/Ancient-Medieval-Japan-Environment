name: AMJ Environment Steam publisher read-only readiness

# Author-only main workflow. No Steam content or tags are changed.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

concurrency:
  group: amje-publisher-readiness
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      github.event.issue.user.login == 'sucRo0629' &&
      github.event.issue.title == '[check:amj-publisher-readiness]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.author.outputs.source_sha }}
    steps:
      - name: Require author's issue and exact current main commit
        id: author
        shell: bash
        env:
          REQUEST_AUTHOR: ${{ github.event.issue.user.login }}
          REQUEST_TITLE: ${{ github.event.issue.title }}
          REQUEST_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_AUTHOR" == "sucRo0629" ]] || exit 2
          [[ "$REQUEST_TITLE" == "[check:amj-publisher-readiness]" ]] || exit 2
          [[ "$GITHUB_EVENT_NAME" == "issues" && "$GITHUB_REF" == "refs/heads/main" ]] || exit 2
          [[ "$REQUEST_BODY" =~ ^source_sha=([0-9a-f]{40})$ ]] || exit 2
          [[ "$GITHUB_SHA" == "${BASH_REMATCH[1]}" ]] || exit 2
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "READINESS_GUARD_PASS main=$GITHUB_SHA (no upload requested)"

  project_artifact:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require private Project read token without printing it
        env:
          PROJECT_ARTIFACT_TOKEN: ${{ secrets.AMJ_PROJECT_ARTIFACT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ARTIFACT_TOKEN" || {
            echo "BLOCKED: private Project artifact reader not configured"; exit 2;
          }
      - name: Download pinned native Project artifact with publisher token
        uses: actions/download-artifact@v4
        with:
          repository: sucRo-RimWorld/Ancient-Medieval-Japan-Project
          run-id: 39247372678
          name: amje-wetland16-39247372678
          github-token: ${{ secrets.AMJ_PROJECT_ARTIFACT_TOKEN }}
          path: Dist/ReadOnlyNative
      - name: Verify original ZIP and genuine DLL without installing it
        shell: bash
        run: |
          set -euo pipefail
          python Tools/SteamPublisher/import_verified_assembly.py \
            --evidence Dist/ReadOnlyNative --checkout .
          echo 'READINESS_PROJECT_ARTIFACT_PASS (no game, no upload)'

  author_approval:
    needs: guard
    runs-on: ubuntu-latest
    environment: steam-workshop-private
    timeout-minutes: 10
    steps:
      - name: Require recorded GitHub author environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          url = ("https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
                 + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "/approvals")
          req = Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(req, timeout=20) as response:
              approvals = json.load(response)
          approved = any(
              item.get("state", "").lower() == "approved"
              and item.get("user", {}).get("login") == "sucRo0629"
              and any(env.get("name") == "steam-workshop-private"
                      for env in item.get("environments", []))
              for item in approvals
          )
          if not approved:
              raise SystemExit("BLOCKED: no recorded owner approval")
          print("READINESS_AUTHOR_APPROVAL_PASS")
          PY

  linux_host:
    needs: [guard, author_approval]
    runs-on: [self-hosted, linux, steamcmd-private-publisher]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false
      - name: Inspect owner-only SteamCMD host state; never invoke SteamCMD
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/SteamPublisher/readiness.py linux \
            --checkout . --repo "$GITHUB_REPOSITORY"

  windows_host:
    needs: [guard, author_approval]
    runs-on: [self-hosted, windows, steamworks-tag-publisher]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false
      - name: Read-only Windows Steamworks login probe; never submit tags
        shell: pwsh
        run: |
          python Tools/SteamPublisher/readiness.py windows --checkout . --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Windows publisher readiness blocked' }
