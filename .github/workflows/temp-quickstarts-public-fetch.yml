name: Temporary public AMJE and CCTO Workshop fetch
on:
  push:
    branches: [tooling/temporary-public-quickstarts-fetch-20261013]
    paths: [.github/workflows/temp-quickstarts-public-fetch.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch official public CCTO and AMJE Workshop assets anonymously
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output steamcmd
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null 2>&1
          curl --fail --show-error --location --retry 2 \
            --output steamcmd.tar.gz \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd.tar.gz -C steamcmd
          timeout 280s ./steamcmd/steamcmd.sh \
            +login anonymous \
            +workshop_download_item 294100 3814638060 \
            +workshop_download_item 294100 3812412548 \
            +quit > output/steamcmd.log 2>&1
          echo "steamcmd_exit=$?" > output/manifest.txt
          for id in 3814638060 3812412548; do
            folder=$(find "$HOME" . -type d -path "*/294100/$id" -print -quit 2>/dev/null)
            if [ -n "$folder" ] && [ -f "$folder/About/About.xml" ]; then
              tar -czf "output/Workshop-$id.tar.gz" -C "$(dirname "$folder")" "$id"
              echo "$id staged=yes" >> output/manifest.txt
              sha256sum "output/Workshop-$id.tar.gz" >> output/manifest.txt
            else
              echo "$id staged=no" >> output/manifest.txt
            fi
          done
          tail -60 output/steamcmd.log >> output/manifest.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anonymous-AMJE-CCTO-workshop
          path: output/
          if-no-files-found: warn
          retention-days: 1
