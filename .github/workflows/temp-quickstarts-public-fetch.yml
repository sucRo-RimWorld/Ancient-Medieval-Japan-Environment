name: Temporary public Workshop anonymous SteamCMD probe
on:
  push:
    branches: [tooling/temporary-public-quickstarts-fetch-20261013]
    paths: [.github/workflows/temp-quickstarts-public-fetch.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Probe Workshop 3210544395 without any Steam credentials
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output steamcmd
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null 2>&1
          curl --fail --show-error --location --retry 2 \
            --output steamcmd.tar.gz \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd.tar.gz -C steamcmd
          timeout 210s ./steamcmd/steamcmd.sh \
            +login anonymous \
            +workshop_download_item 294100 3210544395 \
            +quit > output/steamcmd.log 2>&1
          code=$?
          echo "steamcmd_exit=${code}" > output/probe.txt
          find . -path '*/294100/3210544395/About/About.xml' -print >> output/probe.txt
          if grep -Eq 'Success. Downloaded item 3210544395' output/steamcmd.log; then
            echo "reported_success=true" >> output/probe.txt
          fi
          loc=$(find "$HOME" . -path '*/294100/3210544395/About/About.xml' -print -quit 2>/dev/null)
          if [ -n "$loc" ]; then
            base=$(dirname "$(dirname "$loc")")
            tar -czf output/ProcessorFramework-3210544395.tar.gz -C "$(dirname "$base")" "$(basename "$base")"
            echo "payload_staged=true" >> output/probe.txt
          else
            echo "payload_staged=false" >> output/probe.txt
          fi
          tail -45 output/steamcmd.log >> output/probe.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anonymous-ProcessorFramework-workshop-probe
          path: output/
          if-no-files-found: warn
          retention-days: 1
