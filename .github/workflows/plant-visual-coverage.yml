name: Plant visual coverage ledger
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Docs/PlantVisualCoverage.json'
      - 'Docs/ArtDirection.md'
      - 'Docs/PlantSnowOverlayPlan.md'
      - 'Docs/ValidationEvidence/**'
      - 'Art/**'
      - 'Textures/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Tests/**'
      - 'Scripts/Art/**'
      - '.github/workflows/plant-visual-coverage.yml'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review, converted_to_draft ]
    paths:
      - 'Docs/PlantVisualCoverage.json'
      - 'Docs/ArtDirection.md'
      - 'Docs/PlantSnowOverlayPlan.md'
      - 'Docs/ValidationEvidence/**'
      - 'Art/**'
      - 'Textures/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Tests/**'
      - 'Scripts/Art/**'
      - '.github/workflows/plant-visual-coverage.yml'
concurrency:
  group: plant-visual-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate state inventory and evidence (pending reviews allowed)
        run: python Tests/validate_plant_visual_coverage.py --self-test
      - name: Install fixed-template image validator dependency
        run: python -m pip install Pillow
      - name: Validate accepted production textures and snow registration
        run: |
          python Tests/validate_haimatsu_texture.py
          python Tests/validate_shirabiso_texture.py
          python Tests/validate_haimatsu_snow.py
          python Tests/validate_shii_snow.py
          python Tests/validate_shirabiso_snow.py
          python Tests/validate_beech_snow.py
          python Tests/validate_beech_season_sample.py Docs/ValidationEvidence/BeechSeasonSampleV5-Season.log
