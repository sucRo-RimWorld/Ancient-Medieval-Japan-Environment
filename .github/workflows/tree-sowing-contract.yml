name: Regional tree sowing contract
on:
  push:
    branches: [main]
    paths:
      - 'Defs/BiomeDefs/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Patches/**'
      - 'Languages/Japanese/DefInjected/BiomeDef/**'
      - 'Languages/Japanese/DefInjected/ThingDef/**'
      - 'Tests/Production/test_vanilla_bamboo_description.py'
      - 'Docs/VanillaPlantStep2DescriptionReview-ja.md'
      - 'Tests/Quickstarts/**'
      - 'Tests/Production/test_tree_sowing_contract.py'
      - 'Tests/Production/test_hannoki_production_contract.py'
      - 'Tests/Production/test_structural_plant_commonality.py'
      - 'Tests/Production/test_wetland_ecology_contract.py'
      - 'Docs/Research/WetlandPlantExistingModAudit-ja.md'
      - 'Docs/Research/WetlandPlantImplementationDecision.json'
      - 'Docs/NativeVegetationStep3Design-ja.md'
      - 'Tests/Production/test_wetland_implementation_decision.py'
      - 'Docs/Research/WetlandPlantDistributionDraft.json'
      - 'Tests/Production/test_wetland_production_refs.py'
      - 'Docs/Research/WetlandPlantMaterialDefAudit-ja.md'
      - 'Docs/Research/WetlandPlantMaterialsProfiles-ja.md'
      - 'Tests/Production/test_wetland_material_plant_contract.py'
      - '.github/workflows/tree-sowing-contract.yml'
  pull_request:
    paths:
      - 'Defs/BiomeDefs/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Patches/**'
      - 'Languages/Japanese/DefInjected/BiomeDef/**'
      - 'Languages/Japanese/DefInjected/ThingDef/**'
      - 'Tests/Production/test_vanilla_bamboo_description.py'
      - 'Docs/VanillaPlantStep2DescriptionReview-ja.md'
      - 'Tests/Quickstarts/**'
      - 'Tests/Production/test_tree_sowing_contract.py'
      - 'Tests/Production/test_hannoki_production_contract.py'
      - 'Tests/Production/test_structural_plant_commonality.py'
      - 'Tests/Production/test_wetland_ecology_contract.py'
      - 'Docs/Research/WetlandPlantExistingModAudit-ja.md'
      - 'Docs/Research/WetlandPlantImplementationDecision.json'
      - 'Docs/NativeVegetationStep3Design-ja.md'
      - 'Tests/Production/test_wetland_implementation_decision.py'
      - 'Docs/Research/WetlandPlantDistributionDraft.json'
      - 'Tests/Production/test_wetland_production_refs.py'
      - 'Docs/Research/WetlandPlantMaterialDefAudit-ja.md'
      - 'Docs/Research/WetlandPlantMaterialsProfiles-ja.md'
      - 'Tests/Production/test_wetland_material_plant_contract.py'
      - '.github/workflows/tree-sowing-contract.yml'
concurrency:
  group: tree-sowing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate regional tree sets
        run: python Tests/Production/test_tree_sowing_contract.py
      - name: Validate retained Vanilla wetland ecology bundle
        run: python Tests/Production/test_wetland_ecology_contract.py
      - name: Validate evidence-backed native wetland implementation scope
        run: python Tests/Production/test_wetland_implementation_decision.py
      - name: Validate Suge and Mizugoke XML behavior fixtures (production Defs pending)
        run: python Tests/Production/test_wetland_material_plant_contract.py
      - name: Validate live four-species wetland references (production Defs pending)
        run: python Tests/Production/test_wetland_production_refs.py
      - name: Validate approved Hannoki production artwork, wood balance and CCTO
        run: python Tests/Production/test_hannoki_production_contract.py
      - name: Validate approved structural plant commonalities
        run: python Tests/Production/test_structural_plant_commonality.py
      - name: Validate approved Vanilla tree descriptions without gameplay changes
        run: python Tests/Production/test_vanilla_bamboo_description.py
