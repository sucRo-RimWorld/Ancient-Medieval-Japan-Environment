name: Plant visual coverage ledger
on:
  push:
    paths:
      - 'Docs/**'
      - 'AGENTS.md'
      - 'Textures/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Tests/validate_plant_visual_coverage.py'
      - '.github/workflows/plant-visual-coverage.yml'
  pull_request:
    paths:
      - 'Docs/**'
      - 'AGENTS.md'
      - 'Textures/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Tests/validate_plant_visual_coverage.py'
      - '.github/workflows/plant-visual-coverage.yml'
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate state inventory, evidence and omission regressions
        run: python Tests/validate_plant_visual_coverage.py --self-test --require-complete
      - name: Install fixed-template image validator dependency
        run: python -m pip install Pillow
      - name: Validate accepted production textures and snow registration
        run: |
          python Tests/validate_haimatsu_texture.py
          python Tests/validate_shirabiso_texture.py
          python Tests/validate_haimatsu_snow.py
          python Tests/validate_shii_snow.py
          python Tests/validate_shirabiso_snow.py
          python Tests/validate_beech_snow.py
          python Tests/validate_beech_season_sample.py Docs/ValidationEvidence/BeechSeasonSampleV5-Season.log
