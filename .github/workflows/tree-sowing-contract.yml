name: Regional tree sowing contract
on:
  push:
    branches: [main]
    paths:
      - 'Defs/BiomeDefs/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Patches/**'
      - 'Languages/Japanese/DefInjected/BiomeDef/**'
      - 'Languages/Japanese/DefInjected/ThingDef/**'
      - 'Tests/test_vanilla_bamboo_description.py'
      - 'Docs/VanillaPlantStep2DescriptionReview-ja.md'
      - 'Tests/Quickstarts/**'
      - 'Tests/test_tree_sowing_contract.py'
      - 'Tests/test_wetland_ecology_contract.py'
      - '.github/workflows/tree-sowing-contract.yml'
  pull_request:
    paths:
      - 'Defs/BiomeDefs/**'
      - 'Defs/ThingDefs_Plants/**'
      - 'Patches/**'
      - 'Languages/Japanese/DefInjected/BiomeDef/**'
      - 'Languages/Japanese/DefInjected/ThingDef/**'
      - 'Tests/test_vanilla_bamboo_description.py'
      - 'Docs/VanillaPlantStep2DescriptionReview-ja.md'
      - 'Tests/Quickstarts/**'
      - 'Tests/test_tree_sowing_contract.py'
      - 'Tests/test_wetland_ecology_contract.py'
      - '.github/workflows/tree-sowing-contract.yml'
concurrency:
  group: tree-sowing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate regional tree sets and runtime regression wiring
        run: python Tests/test_tree_sowing_contract.py
      - name: Validate retained Vanilla wetland ecology bundle
        run: python Tests/test_wetland_ecology_contract.py
      - name: Validate approved Bamboo text and unchanged Vanilla planting
        run: python Tests/test_vanilla_bamboo_description.py
