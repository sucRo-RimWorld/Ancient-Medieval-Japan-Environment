name: Workshop payload filtering
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: workshop-payload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  subscriber-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate single-field bilingual Workshop description
        run: python Tests/validate_workshop_description.py
      - name: Validate YADA filter and subscriber payload contract
        run: python Tests/validate_workshop_payload.py
      - name: Reject stale sources, wrong upload roots and payload mutations
        run: python Tests/test_workshop_payload.py && python Tests/test_workshop_pickle.py
      - name: Validate RimTest and development Pickle automation contract
        run: python Tests/test_framework_automation.py
      - name: Compile publication tooling
        run: python -m py_compile Scripts/Build-WorkshopPayload.py Scripts/Run-WorkshopPayloadTests.py Scripts/Combine-WorkshopPayloadResults.py Scripts/Run-WorkshopPickle.py Scripts/EnvironmentFrameworkTestCommon.py Scripts/Run-EnvironmentRimTest.py Scripts/Run-DevelopmentPickle.py Scripts/Audit-WorkshopUploadSource.py Scripts/Build-ReleaseCandidate.py
