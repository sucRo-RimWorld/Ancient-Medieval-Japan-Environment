name: PowerShell syntax validation

on:
  workflow_dispatch:
concurrency:
  group: powershell-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate approved Shirabiso integration
        run: python Tests/validate_shirabiso_texture.py

      - name: Validate approved Haimatsu integration
        run: python Tests/validate_haimatsu_texture.py

      - name: Validate Quicktest fixture staging and probe XML
        run: python Tests/Runtime/test_run_tests_entrypoint.py

      - name: Validate approved biome structural-plant commonalities
        run: python Tests/Production/test_structural_plant_commonality.py

      - name: Run repository PowerShell syntax preflight
        shell: pwsh
        run: ./Scripts/Validate-PowerShellSyntax.ps1
      - name: Reject incomplete or wrong-process native logs
        shell: pwsh
        run: ./Tests/Test-RimWorldRuntime.ps1

      - name: Validate decoded production PNGs and corruption regression
        shell: pwsh
        run: ./Tests/Test-PngImageData.ps1

      - name: Smoke texture Golden Path exact-copy helper
        shell: pwsh
        run: |
          ./Scripts/Install-TextureAsset.ps1 `
            -SourcePath ./Textures/Things/Plant/AMJ/Shii/Shii_A.png `
            -DestinationRelativePath TestResults/GoldenPath/Shii_A.png `
            -Force

          $sourceHash = (Get-FileHash ./Textures/Things/Plant/AMJ/Shii/Shii_A.png -Algorithm SHA256).Hash
          $copyHash = (Get-FileHash ./TestResults/GoldenPath/Shii_A.png -Algorithm SHA256).Hash

          if ($sourceHash -ne $copyHash) {
            throw "Golden Path smoke hash mismatch: source=$sourceHash copy=$copyHash"
          }

  windows-powershell:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate approved Shirabiso integration
        run: python Tests/validate_shirabiso_texture.py

      - name: Validate approved Haimatsu integration
        run: python Tests/validate_haimatsu_texture.py

      - name: Run repository PowerShell syntax preflight
        shell: powershell
        run: ./Scripts/Validate-PowerShellSyntax.ps1
      - name: Reject incomplete or wrong-process native logs
        shell: powershell
        run: ./Tests/Test-RimWorldRuntime.ps1

      - name: Validate decoded production PNGs and corruption regression
        shell: powershell
        run: ./Tests/Test-PngImageData.ps1

      - name: Smoke texture Golden Path exact-copy helper
        shell: powershell
        run: |
          ./Scripts/Install-TextureAsset.ps1 `
            -SourcePath ./Textures/Things/Plant/AMJ/Shii/Shii_A.png `
            -DestinationRelativePath TestResults/GoldenPath/Shii_A.png `
            -Force

          $sourceHash = (Get-FileHash ./Textures/Things/Plant/AMJ/Shii/Shii_A.png -Algorithm SHA256).Hash
          $copyHash = (Get-FileHash ./TestResults/GoldenPath/Shii_A.png -Algorithm SHA256).Hash

          if ($sourceHash -ne $copyHash) {
            throw "Golden Path smoke hash mismatch: source=$sourceHash copy=$copyHash"
          }
