name: Regenerate leafless beech snow candidate

on:
  push:
    branches:
      - art-visual-release-20261006
    paths:
      - 'Scripts/Art/build_beech_snow.py'
      - '.github/workflows/regenerate-beech-leafless-snow.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art-visual-release-20261006
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Regenerate leafless beech snow and verify
        run: |
          python Scripts/Art/build_beech_snow.py
          python Tests/validate_beech_snow.py
      - name: Commit regenerated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             Art/Templates/Beech_Leafless-Snow-v1/editable-mask.png             Art/Templates/Beech_Leafless-Snow-v1/snow-overlay.png             Art/Templates/Beech_Leafless-Snow-v1/exact-composite.png             Art/Templates/Beech_Leafless-Snow-v1/template.json             Textures/Things/Plant/AMJ/Beech_Leafless_Snow/Beech_Leafless_Snow_A.png
          if git diff --cached --quiet; then
            echo "No regenerated changes."
            exit 0
          fi
          git commit -m "Regenerate leafless beech snow as filled clumps"
          git push origin HEAD:art-visual-release-20261006
