name: Temporary public Vanilla Expanded Framework source snapshot transfer
on:
  push:
    branches: [tooling/temporary-public-quickstarts-fetch-20261013]
    paths: [.github/workflows/temp-quickstarts-public-fetch.yml]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch immutable official VEF repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 \
            --output VanillaExpandedFramework-058d42ce.zip \
            https://github.com/Vanilla-Expanded/VanillaExpandedFramework/archive/058d42ce56d5b5c744bd9568db763fb20efe2d34.zip
          unzip -t VanillaExpandedFramework-058d42ce.zip >/dev/null
          unzip -l VanillaExpandedFramework-058d42ce.zip | grep -E '/About/About.xml|/1.6/Assemblies/VFECore.dll'
      - uses: actions/upload-artifact@v4
        with:
          name: VanillaExpandedFramework-official-080926
          path: VanillaExpandedFramework-058d42ce.zip
          if-no-files-found: error
          retention-days: 1
