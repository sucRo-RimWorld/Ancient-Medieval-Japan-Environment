name: Environment Steam publication source verification

on:
  pull_request:
    paths:
      - 'Tools/SteamPublisher/**'
      - 'About/About.xml'
      - 'About/Manifest.xml'
      - 'About/Changelog.txt'
      - 'Docs/SteamWorkshopDescription.txt'
      - 'Docs/2GameDescription-ja.txt'
      - 'Tests/validate_workshop_description.py'
      - 'Publishing/VerifiedAssembly.json'
      - '.github/workflows/steam-approved.yml'
      - '.github/workflows/steam-readiness.yml'
      - 'Tests/Release/test_steam_readiness.py'
      - '.github/workflows/steam-release-static.yml'
      - 'Tests/Release/test_steam_publisher.py'
      - 'Tests/Release/test_verified_assembly.py'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source without private game, token or Steam
        run: python -m py_compile Tools/SteamPublisher/publisher.py Tools/SteamPublisher/tags.py Tools/SteamPublisher/import_verified_assembly.py Tools/SteamPublisher/readiness.py
      - name: Test bilingual Workshop BBCode, gallery and version agreement
        run: python Tests/validate_workshop_description.py
      - name: Test actual candidate text and changenote through the Steam publisher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from Tools.SteamPublisher import publisher
          source = Path(".")
          cfg = publisher.config_from(source, "sucRo-RimWorld/Ancient-Medieval-Japan-Environment")
          meta = publisher.inspect_source(source, cfg)
          assert meta["version"] == "0.2.0"
          assert meta["changenote"].startswith("0.2.0 - ")
          assert meta["description"].count("[img]") == 7
          print("PASS 0.2.0 real publishing metadata, bilingual changenote, 7-image source")
          PY
      - name: Test exact source-only and binary import guards
        run: |
          python Tests/Release/test_steam_publisher.py
          python Tests/Release/test_verified_assembly.py
          python Tests/Release/test_steam_readiness.py
