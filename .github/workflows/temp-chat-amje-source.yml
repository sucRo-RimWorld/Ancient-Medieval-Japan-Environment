name: Temporary Chat Debian Mono compiler bundle
on:
  push:
    branches: [tooling/temporary-chat-dev-source-build-20261013]
    paths:
      - .github/workflows/temp-chat-amje-source.yml
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare matching Debian 13 apt offline Mono compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(pwd)/out"
          docker run --rm -v "$(pwd)/out:/out" debian:trixie-slim bash -ec '
            apt-get update -qq
            apt-get install -y -qq --download-only mono-mcs mono-runtime-sgen > /out/apt-download.log 2>&1
            cp /var/cache/apt/archives/*.deb /out/
            ls -lh /out/*.deb
            printf "packages="; find /out -maxdepth 1 -name "*.deb" | wc -l
          '
          cd out
          sha256sum ./*.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-mono-compiler-offline
          path: out/
          if-no-files-found: error
          retention-days: 1
